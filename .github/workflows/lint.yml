name: Formula style

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  style:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew update
      - run: |
          brew tap-new --no-git kessriga/tap
          tap=$(brew --repository kessriga/tap)
          cp Formula/ghostty-fork.rb "$tap/Formula/ghostty-fork.rb"
          cp -R test "$tap/test"
          brew style --formula kessriga/tap/ghostty-fork
          brew trust --formula kessriga/tap/ghostty-fork
          cd "$(brew --repository)"
          ./bin/brew ruby -- "$tap/test/ghostty_fork_test.rb"
